# OpenSSL 3.5's mingw64 target is x86-specific. This target uses the same
# Windows threading/socket backend with the LLP64 bignum model and C routines.
my %targets = (
    "ddbot-mingw-arm64" => {
        inherit_from => [ "mingw-common" ],
        sys_id => "MINGW64",
        bn_ops => "SIXTY_FOUR_BIT",
    },
);
