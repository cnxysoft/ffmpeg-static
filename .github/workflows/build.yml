name: Publish validated minimal FFmpeg

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Find successful validation for this exact commit
        id: validated
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo 'Select a validated version tag to publish.' >&2
            exit 1
          fi
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow candidate.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [[ -z "$RUN_ID" || "$RUN_ID" == null ]]; then
            echo 'No successful nine-platform candidate validation exists for this commit.' >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.validated.outputs.run_id }}
          pattern: minimal-*
          merge-multiple: true
          path: validated
      - name: Verify and prepare release assets
        env:
          VALIDATED_RUN_ID: ${{ steps.validated.outputs.run_id }}
        run: python3 scripts/prepare-release.py validated release-assets
      - name: Publish verified assets
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME — DDBOT minimal FFmpeg" \
            --notes-file release-notes.md
