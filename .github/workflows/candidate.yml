name: Validate minimal candidate

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ffmpeg-minimal-candidate
      - main

permissions:
  contents: read

env:
  DDBOT_CONSUMER_REF: c1c191435740e1cc9f86314fe890db760476acad
  PYTHONUTF8: '1'

concurrency:
  group: minimal-candidate-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native:
    name: Validate ${{ matrix.target }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-22.04
            arch: amd64
            cc: cc
            shell: bash
          - target: linux-386
            os: ubuntu-22.04
            arch: '386'
            cc: i686-linux-gnu-gcc
            shell: bash
          - target: linux-arm
            os: ubuntu-22.04
            arch: arm
            cc: arm-linux-gnueabihf-gcc
            wrapper: scripts/run-armhf.sh
            shell: bash
          - target: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            cc: cc
            shell: bash
            container: ubuntu:22.04
          - target: darwin-amd64
            os: macos-15-intel
            arch: amd64
            cc: cc
            shell: bash
          - target: darwin-arm64
            os: macos-15
            arch: arm64
            cc: cc
            shell: bash
          - target: windows-amd64
            os: windows-2022
            arch: amd64
            cc: gcc
            msystem: UCRT64
            packages: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-python
            shell: 'msys2 {0}'
          - target: windows-386
            os: windows-2022
            arch: '386'
            cc: gcc
            msystem: MINGW32
            packages: mingw-w64-i686-gcc mingw-w64-ucrt-x86_64-nasm mingw-w64-i686-pkgconf mingw-w64-i686-python
            shell: 'msys2 {0}'
          - target: windows-arm64
            os: windows-11-arm
            arch: arm64
            cc: clang
            msystem: CLANGARM64
            packages: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-llvm mingw-w64-clang-aarch64-pkgconf mingw-w64-clang-aarch64-python
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      TARGET: ${{ matrix.target }}
      CC: ${{ matrix.cc }}
      GOARCH: ${{ matrix.arch }}
      GOARM: '7'
      TARGET_RUNNER: ${{ matrix.wrapper && format('{0}/{1}', github.workspace, matrix.wrapper) || '' }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null; then elevate=(sudo); else elevate=(); fi
          "${elevate[@]}" apt-get update
          "${elevate[@]}" apt-get install -y build-essential nasm pkg-config perl python3 curl xz-utils git ca-certificates file
          case "$TARGET" in
            linux-386) sudo apt-get install -y gcc-i686-linux-gnu libc6-i386 ;;
            linux-arm)
              sudo apt-get install -y gcc-arm-linux-gnueabihf
              # Jammy qemu-user 6.2 corrupts Go ARM concurrent execution. Use
              # Noble's static emulator without changing the target's libc.
              QEMU_DEB="$RUNNER_TEMP/qemu-user-static.deb"
              curl --fail --location --retry 3 -o "$QEMU_DEB" https://archive.ubuntu.com/ubuntu/pool/universe/q/qemu/qemu-user-static_8.2.2%2bds-0ubuntu1.18_amd64.deb
              printf '%s  %s\n' 5bb397f66063efa349f6fd5cb3b68cd96f29edd0994e4ba5115cf0859a716bf0 "$QEMU_DEB" | sha256sum -c -
              dpkg-deb -x "$QEMU_DEB" "$RUNNER_TEMP/ddbot-qemu"
              echo "QEMU_ARM=$RUNNER_TEMP/ddbot-qemu/usr/bin/qemu-arm-static" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config openssl@3
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: >-
            make perl curl tar xz openssl
            ${{ matrix.packages }}
      - name: Build and validate candidate
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          fi
          if [[ "$TARGET" == windows-386 ]]; then export PATH="$PATH:/ucrt64/bin"; fi
          bash scripts/build-native.sh "$PWD/candidate-build" 2>&1 | tee candidate-build.log
      - name: Checkout pinned DDBOT consumer
        uses: actions/checkout@v4
        with:
          repository: cnxysoft/DDBOT-WSa
          ref: ${{ env.DDBOT_CONSUMER_REF }}
          path: ddbot-consumer
          persist-credentials: false
      - name: Set up Go for consumer validation
        uses: actions/setup-go@v5
        with:
          go-version-file: ddbot-consumer/go.mod
          cache-dependency-path: |
            ddbot-consumer/go.sum
            ddbot-consumer/**/go.sum
      - name: Test and build DDBOT with the candidate
        run: |
          set -euo pipefail
          python3 tests/consumer/validate.py
      - name: Upload validated candidate
        uses: actions/upload-artifact@v4
        with:
          name: minimal-${{ matrix.target }}
          path: |
            candidate-build/ffmpeg-*-candidate.zip
            candidate-build/ffmpeg-*-candidate.zip.sha256
          if-no-files-found: error
      - name: Upload validated DDBOT consumer
        uses: actions/upload-artifact@v4
        with:
          name: ddbot-${{ matrix.target }}
          path: |
            candidate-build/DDBOT-candidate-*
            candidate-build/consumer-build-info.txt
            candidate-build/ddbot-*.log
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            candidate-build.log
            candidate-build/package/build-info/
            candidate-build/ffmpeg-*/ffbuild/config.log
            candidate-build/ddbot-*.log
            candidate-build/consumer-build-info.txt
          if-no-files-found: ignore
